<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nicolle Store</title>

    <!-- FUENTES -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =====================================================
           VARIABLES
           ===================================================== */

        :root {
            --menu-bg: #ffffff;
            --menu-text: #2c2725;
            --menu-text-soft: #706866;
            --menu-primary: #a87578;
            --menu-primary-dark: #895c60;
            --menu-border: rgba(44, 39, 37, 0.10);
            --menu-hover: #f8f1ef;
            --menu-white: #ffffff;

            --font-title: "Cormorant Garamond", Georgia, serif;
            --font-body: "DM Sans", Arial, sans-serif;

            --transition: 0.3s ease;
        }


        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--menu-bg);
            color: var(--menu-text);
            font-family: var(--font-body);
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           MENU PRINCIPAL
           ===================================================== */

        .site-header {
            position: relative;
            z-index: 1000;

            width: 100%;

            background: rgba(255, 255, 255, 0.97);

            border-bottom: 1px solid var(--menu-border);
        }


        .navbar {
            width: 100%;
            max-width: 1280px;

            min-height: 86px;

            margin: 0 auto;
            padding: 0 32px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .brand {
            display: flex;
            flex-direction: column;
            align-items: flex-start;

            flex-shrink: 0;

            line-height: 1;
        }

        .brand-name {
            font-family: var(--font-title);
            font-size: 2rem;
            font-weight: 600;
            letter-spacing: 0.02em;

            color: var(--menu-text);
        }

        .brand-subtitle {
            margin-top: 5px;

            font-family: var(--font-body);
            font-size: 0.62rem;
            font-weight: 600;

            letter-spacing: 0.28em;
            text-transform: uppercase;

            color: var(--menu-primary);
        }


        /* =====================================================
           NAVEGACIÓN
           ===================================================== */

        .main-nav {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            flex: 1;
        }

        .nav-link {
            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 0 17px;

            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 600;

            letter-spacing: 0.02em;

            color: var(--menu-text-soft);

            transition:
                color var(--transition),
                background var(--transition);
        }

        .nav-link::after {
            content: "";

            position: absolute;

            left: 17px;
            right: 17px;
            bottom: 3px;

            height: 2px;

            border-radius: 999px;

            background: var(--menu-primary);

            transform: scaleX(0);
            transform-origin: center;

            transition: transform var(--transition);
        }

        .nav-link:hover {
            color: var(--menu-primary-dark);
        }

        .nav-link:hover::after {
            transform: scaleX(1);
        }

        .nav-link.active {
            color: var(--menu-primary-dark);
        }

        .nav-link.active::after {
            transform: scaleX(1);
        }


        /* =====================================================
           ACCIONES
           ===================================================== */

        .nav-actions {
            display: flex;
            align-items: center;

            gap: 8px;

            flex-shrink: 0;
        }

        .nav-action {
            position: relative;

            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: var(--menu-text);

            transition:
                background var(--transition),
                color var(--transition),
                transform var(--transition);
        }

        .nav-action:hover {
            background: var(--menu-hover);
            color: var(--menu-primary-dark);

            transform: translateY(-1px);
        }


        /* =====================================================
           ICONOS
           ===================================================== */

        .nav-action svg {
            width: 19px;
            height: 19px;

            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           CARRITO / FAVORITOS
           ===================================================== */

        .action-badge {
            position: absolute;

            top: 4px;
            right: 2px;

            min-width: 17px;
            height: 17px;

            padding: 0 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: var(--menu-primary);

            color: var(--menu-white);

            font-family: var(--font-body);
            font-size: 0.58rem;
            font-weight: 700;

            line-height: 1;
        }


        /* =====================================================
           BOTÓN MENÚ MÓVIL
           ===================================================== */

        .mobile-toggle {
            display: none;

            width: 43px;
            height: 43px;

            border: 0;
            border-radius: 50%;

            background: transparent;

            cursor: pointer;

            color: var(--menu-text);
        }

        .mobile-toggle:hover {
            background: var(--menu-hover);
        }

        .mobile-toggle svg {
            width: 21px;
            height: 21px;

            stroke: currentColor;
            fill: none;
            stroke-width: 1.7;

            stroke-linecap: round;
        }


        /* =====================================================
           MENÚ MÓVIL
           ===================================================== */

        .mobile-menu {
            display: none;

            border-top: 1px solid var(--menu-border);

            background: var(--menu-bg);
        }

        .mobile-menu.open {
            display: block;
        }

        .mobile-menu-inner {
            padding: 12px 24px 24px;
        }

        .mobile-link {
            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 52px;

            border-bottom: 1px solid var(--menu-border);

            font-family: var(--font-body);
            font-size: 0.9rem;
            font-weight: 600;

            color: var(--menu-text);
        }

        .mobile-link span {
            color: var(--menu-primary);
            font-size: 1.1rem;
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1050px) {

            .navbar {
                padding: 0 24px;
            }

            .main-nav {
                gap: 0;
            }

            .nav-link {
                padding: 0 11px;
                font-size: 0.76rem;
            }

            .nav-link::after {
                left: 11px;
                right: 11px;
            }

            .brand-name {
                font-size: 1.8rem;
            }

            .nav-actions {
                gap: 2px;
            }
        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 760px) {

            .navbar {
                min-height: 72px;

                padding: 0 18px;

                gap: 10px;
            }

            .brand-name {
                font-size: 1.75rem;
            }

            .brand-subtitle {
                font-size: 0.55rem;
                letter-spacing: 0.22em;
            }

            .main-nav {
                display: none;
            }

            .nav-actions {
                margin-left: auto;
            }

            .nav-action {
                width: 39px;
                height: 39px;
            }

            .nav-action.search-action {
                display: none;
            }

            .mobile-toggle {
                display: flex;
                align-items: center;
                justify-content: center;
            }
        }


        /* =====================================================
           MÓVIL PEQUEÑO
           ===================================================== */

        @media (max-width: 420px) {

            .navbar {
                padding: 0 14px;
            }

            .brand-name {
                font-size: 1.55rem;
            }

            .brand-subtitle {
                font-size: 0.5rem;
            }

            .nav-action {
                width: 36px;
                height: 36px;
            }

            .mobile-toggle {
                width: 36px;
                height: 36px;
            }
        }

    </style>
</head>


<body>

    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <div class="navbar">


            <!-- =================================================
                 LOGO
                 ================================================= -->

            <a href="../index.html" class="brand">

                <span class="brand-name">
                    Nicolle
                </span>

                <span class="brand-subtitle">
                    Beauty & Style
                </span>

            </a>


            <!-- =================================================
                 NAVEGACIÓN DESKTOP
                 ================================================= -->

            <nav class="main-nav" aria-label="Navegación principal">

                <a href="../index.html" class="nav-link active">
                    Inicio
                </a>

                <a href="../index.html#categorias" class="nav-link">
                    Categorías
                </a>

                <a href="../paginas/cabello.html" class="nav-link">
                    Cabello
                </a>

                <a href="../paginas/piel.html" class="nav-link">
                    Piel
                </a>

                <a href="../paginas/maquillaje.html" class="nav-link">
                    Maquillaje
                </a>

                <a href="../paginas/accesorios.html" class="nav-link">
                    Accesorios
                </a>

                <a href="../paginas/joyeria.html" class="nav-link">
                    Joyería
                </a>

                <a href="../paginas/bolsos.html" class="nav-link">
                    Bolsos
                </a>

            </nav>


            <!-- =================================================
                 ACCIONES
                 ================================================= -->

            <div class="nav-actions">


                <!-- BÚSQUEDA -->

                <a
                    href="#"
                    class="nav-action search-action"
                    aria-label="Buscar"
                >

                    <svg viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="6.5"></circle>
                        <path d="M16 16l5 5"></path>
                    </svg>

                </a>


                <!-- FAVORITOS -->

                <a
                    href="#"
                    class="nav-action"
                    aria-label="Favoritos"
                >

                    <svg viewBox="0 0 24 24">
                        <path d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.7 4.7 0 0 1 8 4c1.5 0 2.9.7 4 1.8A5.3 5.3 0 0 1 16 4a4.7 4.7 0 0 1 4.8 4.7Z"></path>
                    </svg>

                </a>


                <!-- CARRITO -->

                <a
                    href="#"
                    class="nav-action"
                    aria-label="Carrito"
                >

                    <svg viewBox="0 0 24 24">
                        <path d="M4 5h2l1.5 10h10L20 8H7"></path>
                        <circle cx="10" cy="19" r="1.2"></circle>
                        <circle cx="17" cy="19" r="1.2"></circle>
                    </svg>

                    <span class="action-badge">
                        0
                    </span>

                </a>


                <!-- MENÚ MÓVIL -->

                <button
                    type="button"
                    class="mobile-toggle"
                    id="mobileToggle"
                    aria-label="Abrir menú"
                    aria-expanded="false"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"></path>
                        <path d="M4 12h16"></path>
                        <path d="M4 17h16"></path>

                    </svg>

                </button>

            </div>

        </div>


        <!-- =====================================================
             MENÚ MÓVIL
             ===================================================== -->

        <div class="mobile-menu" id="mobileMenu">

            <div class="mobile-menu-inner">

                <a href="../index.html" class="mobile-link">
                    Inicio
                    <span>→</span>
                </a>

                <a href="../index.html#categorias" class="mobile-link">
                    Categorías
                    <span>→</span>
                </a>

                <a href="../paginas/cabello.html" class="mobile-link">
                    Cabello
                    <span>→</span>
                </a>

                <a href="../paginas/piel.html" class="mobile-link">
                    Piel
                    <span>→</span>
                </a>

                <a href="../paginas/maquillaje.html" class="mobile-link">
                    Maquillaje
                    <span>→</span>
                </a>

                <a href="../paginas/accesorios.html" class="mobile-link">
                    Accesorios
                    <span>→</span>
                </a>

                <a href="../paginas/joyeria.html" class="mobile-link">
                    Joyería
                    <span>→</span>
                </a>

                <a href="../paginas/bolsos.html" class="mobile-link">
                    Bolsos
                    <span>→</span>
                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
         JAVASCRIPT DEL MENÚ
         ===================================================== -->

    <script>

        const mobileToggle =
            document.getElementById("mobileToggle");

        const mobileMenu =
            document.getElementById("mobileMenu");


        mobileToggle.addEventListener("click", function () {

            const isOpen =
                mobileMenu.classList.toggle("open");

            mobileToggle.setAttribute(
                "aria-expanded",
                isOpen
            );

        });


        /*
         * Cerrar menú móvil al seleccionar una opción
         */

        document
            .querySelectorAll(".mobile-link")
            .forEach(function (link) {

                link.addEventListener("click", function () {

                    mobileMenu.classList.remove("open");

                    mobileToggle.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                });

            });

    </script>

</body>
</html>
