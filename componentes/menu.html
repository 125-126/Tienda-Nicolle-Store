<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nicolle Store</title>

    <!-- =====================================================
         FUENTES
         ===================================================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Great+Vibes&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =====================================================
           VARIABLES
           ===================================================== */

        :root {

            /* Fondo */
            --menu-bg: #ffffff;
            --menu-bg-soft: #f9ffff;

            /* Aqua */
            --aqua: #8fd8d2;
            --aqua-dark: #5fb9b1;
            --aqua-soft: #e5f7f5;

            /* Rosado tierno */
            --pink: #e9bfc5;
            --pink-dark: #d79da6;
            --pink-soft: #fdf0f2;

            /* Texto */
            --text: #3a3433;
            --text-soft: #756d6b;

            /* Bordes */
            --border: rgba(95, 185, 177, 0.18);

            /* Blanco */
            --white: #ffffff;

            /* Fuentes */
            --font-logo: "Great Vibes", cursive;
            --font-title: "Cormorant Garamond", Georgia, serif;
            --font-body: "DM Sans", Arial, sans-serif;

            --transition: 0.3s ease;
        }


        /* =====================================================
           RESET
           ===================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: var(--menu-bg);
            color: var(--text);
            font-family: var(--font-body);
        }

        a {
            color: inherit;
            text-decoration: none;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .site-header {
            position: relative;
            z-index: 1000;

            width: 100%;

            background:
                linear-gradient(
                    90deg,
                    #ffffff 0%,
                    #fbffff 50%,
                    #fffafb 100%
                );

            border-bottom: 1px solid var(--border);

            box-shadow:
                0 4px 20px rgba(95, 185, 177, 0.06);
        }


        /* =====================================================
           NAVBAR
           ===================================================== */

        .navbar {

            width: 100%;
            max-width: 1320px;

            min-height: 88px;

            margin: 0 auto;

            padding: 0 32px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 30px;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .brand {

            display: flex;
            flex-direction: column;
            align-items: flex-start;

            flex-shrink: 0;

            line-height: 1;

            transition:
                transform var(--transition);
        }

        .brand:hover {
            transform: translateY(-1px);
        }


        .brand-name {

            font-family: var(--font-logo);

            font-size: 3rem;
            font-weight: 400;

            line-height: 0.9;

            color: var(--aqua-dark);

            white-space: nowrap;

            text-shadow:
                0 2px 12px rgba(95, 185, 177, 0.12);
        }


        .brand-subtitle {

            margin-top: 8px;
            margin-left: 5px;

            font-family: var(--font-body);

            font-size: 0.55rem;
            font-weight: 700;

            letter-spacing: 0.32em;

            text-transform: uppercase;

            color: var(--pink-dark);
        }


        /* =====================================================
           NAVEGACIÓN
           ===================================================== */

        .main-nav {

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 4px;

            flex: 1;
        }


        .nav-link {

            position: relative;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 44px;

            padding: 0 15px;

            border-radius: 30px;

            font-family: var(--font-body);

            font-size: 0.78rem;
            font-weight: 600;

            letter-spacing: 0.015em;

            color: var(--text-soft);

            transition:
                color var(--transition),
                background var(--transition),
                transform var(--transition);
        }


        .nav-link::after {

            content: "";

            position: absolute;

            left: 18px;
            right: 18px;

            bottom: 5px;

            height: 2px;

            border-radius: 100px;

            background:
                linear-gradient(
                    90deg,
                    var(--aqua),
                    var(--pink)
                );

            transform: scaleX(0);

            transform-origin: center;

            transition:
                transform var(--transition);
        }


        .nav-link:hover {

            color: var(--aqua-dark);

            background: var(--aqua-soft);

            transform: translateY(-1px);
        }


        .nav-link:hover::after {
            transform: scaleX(1);
        }


        .nav-link.active {

            color: var(--aqua-dark);

            background: var(--aqua-soft);
        }


        .nav-link.active::after {
            transform: scaleX(1);
        }


        /* =====================================================
           ACCIONES
           ===================================================== */

        .nav-actions {

            display: flex;
            align-items: center;

            gap: 7px;

            flex-shrink: 0;
        }


        .nav-action {

            position: relative;

            width: 43px;
            height: 43px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 1px solid transparent;

            border-radius: 50%;

            color: var(--text);

            transition:
                background var(--transition),
                border-color var(--transition),
                color var(--transition),
                transform var(--transition);
        }


        .nav-action:hover {

            background: var(--pink-soft);

            border-color: rgba(215, 157, 166, 0.25);

            color: var(--pink-dark);

            transform: translateY(-2px);
        }


        /* =====================================================
           ICONOS
           ===================================================== */

        .nav-action svg {

            width: 19px;
            height: 19px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.7;

            stroke-linecap: round;
            stroke-linejoin: round;
        }


        /* =====================================================
           BADGE CARRITO
           ===================================================== */

        .action-badge {

            position: absolute;

            top: 2px;
            right: 0;

            min-width: 17px;
            height: 17px;

            padding: 0 4px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    var(--pink),
                    var(--pink-dark)
                );

            color: var(--white);

            font-family: var(--font-body);

            font-size: 0.57rem;
            font-weight: 700;

            line-height: 1;

            box-shadow:
                0 2px 7px rgba(215, 157, 166, 0.25);
        }


        /* =====================================================
           BOTÓN MENÚ MÓVIL
           ===================================================== */

        .mobile-toggle {

            display: none;

            width: 43px;
            height: 43px;

            border: 1px solid rgba(95, 185, 177, 0.18);

            border-radius: 50%;

            background: transparent;

            cursor: pointer;

            color: var(--aqua-dark);

            transition:
                background var(--transition),
                transform var(--transition);
        }


        .mobile-toggle:hover {

            background: var(--aqua-soft);

            transform: translateY(-1px);
        }


        .mobile-toggle svg {

            width: 21px;
            height: 21px;

            stroke: currentColor;

            fill: none;

            stroke-width: 1.7;

            stroke-linecap: round;
        }


        /* =====================================================
           MENÚ MÓVIL
           ===================================================== */

        .mobile-menu {

            display: none;

            border-top: 1px solid var(--border);

            background:
                linear-gradient(
                    180deg,
                    #ffffff,
                    #fbffff
                );
        }


        .mobile-menu.open {
            display: block;
        }


        .mobile-menu-inner {

            padding: 10px 24px 25px;
        }


        .mobile-link {

            display: flex;
            align-items: center;
            justify-content: space-between;

            min-height: 53px;

            border-bottom: 1px solid var(--border);

            font-family: var(--font-body);

            font-size: 0.9rem;
            font-weight: 600;

            color: var(--text);

            transition:
                color var(--transition),
                padding var(--transition);
        }


        .mobile-link:hover {

            padding-left: 7px;

            color: var(--aqua-dark);
        }


        .mobile-link span {

            color: var(--pink-dark);

            font-size: 1.15rem;

            transition:
                transform var(--transition);
        }


        .mobile-link:hover span {
            transform: translateX(5px);
        }


        /* =====================================================
           TABLET
           ===================================================== */

        @media (max-width: 1120px) {

            .navbar {
                padding: 0 24px;
            }

            .main-nav {
                gap: 0;
            }

            .nav-link {
                padding: 0 10px;
                font-size: 0.73rem;
            }

            .nav-link::after {
                left: 12px;
                right: 12px;
            }

            .brand-name {
                font-size: 2.7rem;
            }

            .nav-actions {
                gap: 2px;
            }
        }


        /* =====================================================
           TABLET PEQUEÑA
           ===================================================== */

        @media (max-width: 900px) {

            .navbar {
                gap: 15px;
            }

            .brand-name {
                font-size: 2.45rem;
            }

            .brand-subtitle {
                font-size: 0.5rem;
            }

            .nav-link {
                padding: 0 7px;
                font-size: 0.68rem;
            }

            .nav-action {
                width: 40px;
                height: 40px;
            }
        }


        /* =====================================================
           MÓVIL
           ===================================================== */

        @media (max-width: 760px) {

            .navbar {

                min-height: 74px;

                padding: 0 18px;

                gap: 10px;
            }


            .brand-name {
                font-size: 2.35rem;
            }


            .brand-subtitle {

                margin-top: 6px;

                font-size: 0.48rem;

                letter-spacing: 0.23em;
            }


            .main-nav {
                display: none;
            }


            .nav-actions {

                margin-left: auto;

                gap: 3px;
            }


            .nav-action {

                width: 39px;
                height: 39px;
            }


            .nav-action.search-action {
                display: none;
            }


            .mobile-toggle {

                display: flex;

                align-items: center;
                justify-content: center;
            }
        }


        /* =====================================================
           MÓVIL PEQUEÑO
           ===================================================== */

        @media (max-width: 420px) {

            .navbar {
                padding: 0 14px;
            }


            .brand-name {
                font-size: 2rem;
            }


            .brand-subtitle {
                font-size: 0.44rem;
            }


            .nav-action {

                width: 36px;
                height: 36px;
            }


            .mobile-toggle {

                width: 36px;
                height: 36px;
            }


            .mobile-menu-inner {
                padding-left: 18px;
                padding-right: 18px;
            }
        }

    </style>
</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="site-header">

        <div class="navbar">


            <!-- =================================================
                 LOGO
                 ================================================= -->

            <a
                href="../index.html"
                class="brand"
            >

                <span class="brand-name">
                    Nicolle Store
                </span>

                <span class="brand-subtitle">
                    Beauty & Style
                </span>

            </a>


            <!-- =================================================
                 NAVEGACIÓN
                 ================================================= -->

            <nav
                class="main-nav"
                aria-label="Navegación principal"
            >

                <a
                    href="../index.html"
                    class="nav-link active"
                >
                    Inicio
                </a>


                <a
                    href="../index.html#categorias"
                    class="nav-link"
                >
                    Categorías
                </a>


                <a
                    href="../paginas/cabello.html"
                    class="nav-link"
                >
                    Cabello
                </a>


                <a
                    href="../paginas/piel.html"
                    class="nav-link"
                >
                    Piel
                </a>


                <a
                    href="../paginas/maquillaje.html"
                    class="nav-link"
                >
                    Maquillaje
                </a>


                <a
                    href="../paginas/accesorios.html"
                    class="nav-link"
                >
                    Accesorios
                </a>


                <a
                    href="../paginas/joyeria.html"
                    class="nav-link"
                >
                    Joyería
                </a>


                <a
                    href="../paginas/bolsos.html"
                    class="nav-link"
                >
                    Bolsos
                </a>

            </nav>


            <!-- =================================================
                 ACCIONES
                 ================================================= -->

            <div class="nav-actions">


                <!-- BÚSQUEDA -->

                <a
                    href="#"
                    class="nav-action search-action"
                    aria-label="Buscar"
                >

                    <svg viewBox="0 0 24 24">

                        <circle
                            cx="11"
                            cy="11"
                            r="6.5">
                        </circle>

                        <path d="M16 16l5 5"></path>

                    </svg>

                </a>


                <!-- FAVORITOS -->

                <a
                    href="#"
                    class="nav-action"
                    aria-label="Favoritos"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M20.8 8.7c0 5-8.8 10.3-8.8 10.3S3.2 13.7 3.2 8.7A4.7 4.7 0 0 1 8 4c1.5 0 2.9.7 4 1.8A5.3 5.3 0 0 1 16 4a4.7 4.7 0 0 1 4.8 4.7Z">
                        </path>

                    </svg>

                </a>


                <!-- CARRITO -->

                <a
                    href="#"
                    class="nav-action"
                    aria-label="Carrito"
                >

                    <svg viewBox="0 0 24 24">

                        <path
                            d="M4 5h2l1.5 10h10L20 8H7">
                        </path>

                        <circle
                            cx="10"
                            cy="19"
                            r="1.2">
                        </circle>

                        <circle
                            cx="17"
                            cy="19"
                            r="1.2">
                        </circle>

                    </svg>


                    <span class="action-badge">
                        0
                    </span>

                </a>


                <!-- MENÚ MÓVIL -->

                <button
                    type="button"
                    class="mobile-toggle"
                    id="mobileToggle"
                    aria-label="Abrir menú"
                    aria-expanded="false"
                >

                    <svg viewBox="0 0 24 24">

                        <path d="M4 7h16"></path>

                        <path d="M4 12h16"></path>

                        <path d="M4 17h16"></path>

                    </svg>

                </button>

            </div>

        </div>


        <!-- =====================================================
             MENÚ MÓVIL
             ===================================================== -->

        <div
            class="mobile-menu"
            id="mobileMenu"
        >

            <div class="mobile-menu-inner">


                <a
                    href="../index.html"
                    class="mobile-link"
                >
                    Inicio
                    <span>→</span>
                </a>


                <a
                    href="../index.html#categorias"
                    class="mobile-link"
                >
                    Categorías
                    <span>→</span>
                </a>


                <a
                    href="../paginas/cabello.html"
                    class="mobile-link"
                >
                    Cabello
                    <span>→</span>
                </a>


                <a
                    href="../paginas/piel.html"
                    class="mobile-link"
                >
                    Piel
                    <span>→</span>
                </a>


                <a
                    href="../paginas/maquillaje.html"
                    class="mobile-link"
                >
                    Maquillaje
                    <span>→</span>
                </a>


                <a
                    href="../paginas/accesorios.html"
                    class="mobile-link"
                >
                    Accesorios
                    <span>→</span>
                </a>


                <a
                    href="../paginas/joyeria.html"
                    class="mobile-link"
                >
                    Joyería
                    <span>→</span>
                </a>


                <a
                    href="../paginas/bolsos.html"
                    class="mobile-link"
                >
                    Bolsos
                    <span>→</span>
                </a>

            </div>

        </div>

    </header>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script>

        const mobileToggle =
            document.getElementById("mobileToggle");

        const mobileMenu =
            document.getElementById("mobileMenu");


        mobileToggle.addEventListener(
            "click",
            function () {

                const isOpen =
                    mobileMenu.classList.toggle("open");


                mobileToggle.setAttribute(
                    "aria-expanded",
                    isOpen
                );

            }
        );


        /*
         * Cerrar menú al seleccionar una opción
         */

        document
            .querySelectorAll(".mobile-link")
            .forEach(
                function (link) {

                    link.addEventListener(
                        "click",
                        function () {

                            mobileMenu.classList.remove(
                                "open"
                            );

                            mobileToggle.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                        }
                    );

                }
            );

    </script>

</body>
</html>
