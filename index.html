<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nicolle Store</title>

    <link
        rel="stylesheet"
        href="css/principal.css"
    >

</head>


<body>


    <!-- =====================================================
         MENÚ
         EL MENÚ COMPLETO ESTÁ EN componentes/menu.html
    ====================================================== -->

    <div class="menu-container">

        <iframe
            id="menuFrame"
            src="componentes/menu.html"
            title="Menú principal de Nicolle Store"
            scrolling="no">
        </iframe>

    </div>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main id="contenido"></main>


    <!-- =====================================================
         CONTROL DE ALTURA DEL MENÚ
    ====================================================== -->

    <script>

        window.addEventListener("message", function (event) {

            if (
                !event.data ||
                event.data.tipo !== "nicolle-menu-altura"
            ) {
                return;
            }


            const iframe = document.getElementById("menuFrame");

            if (!iframe) {
                return;
            }


            const altura = Number(event.data.altura);


            if (!Number.isFinite(altura)) {
                return;
            }


            iframe.style.height = altura + "px";

        });

    </script>


</body>

</html>
