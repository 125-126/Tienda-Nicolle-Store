<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nicolle Store</title>


<!-- =====================================================
     CSS PRINCIPAL
====================================================== -->

<link
    rel="stylesheet"
    href="css/principal.css"
>


</head>

<body>


<!-- =====================================================
     MENÚ

     IMPORTANTE:
     EL MENÚ COMPLETO ESTÁ EN:

     componentes/menu.html

     Aquí NO colocamos el código del menú.
====================================================== -->

<div class="menu-container">

    <iframe
        id="menuFrame"
        src="componentes/menu.html"
        title="Menú principal de Nicolle Store"
        scrolling="no"
        frameborder="0">
    </iframe>

</div>


<!-- =====================================================
     CONTENIDO PRINCIPAL
====================================================== -->

<main id="contenido">

```
<!-- =================================================
     HERO
================================================== -->

<section class="hero">


    <!-- =================================================
         VIDEO DEL HERO
    ================================================== -->

    <video
        id="heroVideo"
        class="hero-video"
        autoplay
        muted
        loop
        playsinline
        preload="auto"
    >

        <source
            src="video/hero.mp4"
            type="video/mp4"
        >

    </video>


    <!-- =================================================
         BOTÓN DE AUDIO
    ================================================== -->

    <button
        id="heroSoundButton"
        class="hero-sound-button"
        type="button"
        aria-label="Activar sonido"
        title="Activar sonido"
    >

        <i class="fa-solid fa-volume-xmark"></i>

    </button>


</section>
```

</main>

<!-- =====================================================
     CONTROL DEL AUDIO
====================================================== -->

<script>

    const heroVideo = document.getElementById("heroVideo");

    const heroSoundButton =
        document.getElementById("heroSoundButton");


    heroSoundButton.addEventListener("click", function() {


        /*
         * Si el video está silenciado,
         * activamos el sonido.
         */

        if (heroVideo.muted) {

            heroVideo.muted = false;

            heroSoundButton.innerHTML =
                '<i class="fa-solid fa-volume-high"></i>';

            heroSoundButton.setAttribute(
                "aria-label",
                "Silenciar video"
            );

            heroSoundButton.setAttribute(
                "title",
                "Silenciar video"
            );

        }


        /*
         * Si el video tiene sonido,
         * lo silenciamos.
         */

        else {

            heroVideo.muted = true;

            heroSoundButton.innerHTML =
                '<i class="fa-solid fa-volume-xmark"></i>';

            heroSoundButton.setAttribute(
                "aria-label",
                "Activar sonido"
            );

            heroSoundButton.setAttribute(
                "title",
                "Activar sonido"
            );

        }

    });

</script>



<!-- =====================================================
     AJUSTE AUTOMÁTICO DEL IFRAME

     Esto permite que el menú móvil se expanda
     cuando presionamos la hamburguesa.
====================================================== -->

<script>

    const menuFrame = document.getElementById("menuFrame");


    window.addEventListener("message", function(event) {

        if (!event.data) {
            return;
        }


        if (event.data.tipo !== "nicolle-menu-altura") {
            return;
        }


        const altura = Number(event.data.altura);


        if (!Number.isFinite(altura)) {
            return;
        }


        menuFrame.style.height = altura + "px";

    });


</script>


</body>

</html>
