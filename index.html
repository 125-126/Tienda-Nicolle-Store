<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Nicolle Store</title>


<!-- =====================================================
     CSS PRINCIPAL
====================================================== -->

<link
    rel="stylesheet"
    href="css/principal.css"
>


</head>

<body>


<!-- =====================================================
     MENÚ

     IMPORTANTE:
     EL MENÚ COMPLETO ESTÁ EN:

     componentes/menu.html

     Aquí NO colocamos el código del menú.
====================================================== -->

<div class="menu-container">

    <iframe
        id="menuFrame"
        src="componentes/menu.html"
        title="Menú principal de Nicolle Store"
        scrolling="no"
        frameborder="0">
    </iframe>

</div>


<!-- =====================================================
     CONTENIDO PRINCIPAL
====================================================== -->

<main id="contenido">


    <!-- =================================================
         HERO
    ================================================== -->

    <section class="hero">


        <!--
            Imagen utilizada como marca de agua.
            Archivo:

            imagenes/hero.jpg
        -->

        <div class="hero-watermark"></div>


        <!-- CONTENIDO DEL HERO -->

        <div class="hero-content">


            <span class="hero-small">
                BEAUTY & STYLE
            </span>


            <h1>
                Tu estilo,<br>
                tu esencia.
            </h1>


            <p>
                Descubre algo especial para ti.
            </p>


            <a
                href="#categorias"
                class="hero-button"
            >
                Comprar ahora
            </a>


        </div>


    </section>


</main>


<!-- =====================================================
     AJUSTE AUTOMÁTICO DEL IFRAME

     Esto permite que el menú móvil se expanda
     cuando presionamos la hamburguesa.
====================================================== -->

<script>

    const menuFrame = document.getElementById("menuFrame");


    window.addEventListener("message", function(event) {

        if (!event.data) {
            return;
        }


        if (event.data.tipo !== "nicolle-menu-altura") {
            return;
        }


        const altura = Number(event.data.altura);


        if (!Number.isFinite(altura)) {
            return;
        }


        menuFrame.style.height = altura + "px";

    });


</script>


</body>

</html>
